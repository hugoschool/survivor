services:
  frontend:
    container_name: survivor-frontend
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    container_name: survivor-backend
    build:
      context: ./backend
    environment:
      DB_URL: postgres://postgres:${POSTGRES_PASSWORD}@survivor-postgres:5432/postgres
    ports:
      - "0.0.0.0:8080:8080"
    depends_on:
      - postgres

  postgres:
    container_name: survivor-postgres
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
