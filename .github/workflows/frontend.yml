name: Frontend

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  biome:
    name: Check biome
    if: ${{ github.repository_owner == 'hugoschool' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: latest

      - name: Run Biome
        run: biome ci .
        working-directory: frontend/
