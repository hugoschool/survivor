name: Frontend

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOCKER_IMAGE: survivor-frontend

jobs:
  biome:
    name: Check biome
    if: ${{ github.repository_owner == 'hugoschool' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: latest

      - name: Run Biome
        run: biome ci .
        working-directory: frontend/

  # https://docs.docker.com/build/ci/github-actions/share-image-jobs/
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export
        uses: docker/build-push-action@v7
        with:
          context: frontend/
          tags: ${{ env.DOCKER_IMAGE }}:latest
          outputs: type=docker,dest=${{ runner.temp }}/${{ env.DOCKER_IMAGE }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DOCKER_IMAGE }}
          path: ${{ runner.temp }}/${{ env.DOCKER_IMAGE }}.tar
